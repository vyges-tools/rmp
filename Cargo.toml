[package]
name = "vyges-rmp"
version = "0.1.45"
edition = "2021"
description = "Logic restructuring on an AIG: re-synthesis of timing-critical or area-heavy logic, with every rewrite checkable for equivalence."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/rmp"
build = "build.rs"

[dependencies]
serde_json = "1"
# The causal trail. ⚠️ `default-features = false` as in the other engines: the trail is
# structured output on stderr, not a logging framework this engine gets to choose.
vyges-events = { git = "https://github.com/vyges-tools/events", branch = "main", default-features = false }
# Liberty: which terminals are clocks, which outputs are constant.
vyges-sta = { git = "https://github.com/vyges-tools/sta.git", branch = "main" }
# The design database: the cut read out, the re-synthesised gates written back.
vyges-opendb = { git = "https://github.com/vyges-tools/opendb.git", branch = "main", features = ["gen-write"] }

[[bin]]
name = "vyges-rmp"
path = "src/main.rs"

[lib]
name = "vyges_rmp"
path = "src/lib.rs"

# Local development against the sibling checkout.
[patch."https://github.com/vyges-tools/sta.git"]
vyges-sta = { path = "../vyges-tools-sta" }

[patch."https://github.com/vyges-tools/opendb.git"]
vyges-opendb = { path = "../vyges-tools-opendb" }

[patch."https://github.com/vyges-tools/opendb-lib.git"]
vyges-opendb-lib = { path = "../vyges-tools-opendb-lib" }
