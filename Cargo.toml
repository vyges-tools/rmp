[package]
name = "vyges-rmp"
version = "0.1.50"
edition = "2021"
description = "Logic restructuring on an AIG: re-synthesis of timing-critical or area-heavy logic, with every rewrite checkable for equivalence."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/rmp"
build = "build.rs"

[features]
# The command-line entry built into the library too (`cli_main`), for the suite binaries
# that link every engine and run the one they are invoked as.
suite = []

[dependencies]
serde_json = "1"
# The causal trail. ⚠️ `default-features = false` as in the other engines: the trail is
# structured output on stderr, not a logging framework this engine gets to choose.
vyges-events = { git = "https://github.com/vyges-tools/events", branch = "main", default-features = false }
# Liberty: which terminals are clocks, which outputs are constant.
vyges-sta = { git = "https://github.com/vyges-tools/sta.git", branch = "main" }
# The cut a re-synthesis works on: extracted, written to ABC, put back.
vyges-cut = { git = "https://github.com/vyges-tools/cut", branch = "main" }
# The design database: the cut read out, the re-synthesised gates written back.
vyges-opendb = { git = "https://github.com/vyges-tools/opendb.git", branch = "main", features = ["gen-write"] }
# ABC, in process, as the reference links it: `restructure` sources one script per mode.
vyges-abc-lib = { git = "https://github.com/vyges-tools/abc-lib", branch = "main" }
# The timer `restructure` asks: the netlist over the database (grt), the libraries and constraints
# (rsz), the logic constants (est), the constraint reader (loom).
vyges-rsz = { git = "https://github.com/vyges-tools/rsz.git", branch = "main", features = ["cli"] }
vyges-grt = { git = "https://github.com/vyges-tools/grt.git", branch = "main", default-features = false, features = ["odb"] }
vyges-est = { git = "https://github.com/vyges-tools/est.git", branch = "main", features = ["odb"] }
vyges-loom = { git = "https://github.com/vyges-tools/loom.git", branch = "main" }

[[bin]]
name = "vyges-rmp"
path = "src/main.rs"

[lib]
name = "vyges_rmp"
path = "src/lib.rs"

# Local development against the sibling checkout.
[patch."https://github.com/vyges-tools/sta.git"]
vyges-sta = { path = "../vyges-tools-sta" }

[patch."https://github.com/vyges-tools/opendb.git"]
vyges-opendb = { path = "../vyges-tools-opendb" }

[patch."https://github.com/vyges-tools/opendb-lib.git"]
vyges-opendb-lib = { path = "../vyges-tools-opendb-lib" }

[patch."https://github.com/vyges-tools/cut"]
vyges-cut = { path = "../vyges-tools-cut" }

[patch."https://github.com/vyges-tools/abc-lib"]
vyges-abc-lib = { path = "../vyges-tools-abc-lib" }

[patch."https://github.com/vyges-tools/rsz.git"]
vyges-rsz = { path = "../vyges-tools-rsz" }

[patch."https://github.com/vyges-tools/grt.git"]
vyges-grt = { path = "../vyges-tools-grt" }

[patch."https://github.com/vyges-tools/est.git"]
vyges-est = { path = "../vyges-tools-est" }

[patch."https://github.com/vyges-tools/stt.git"]
vyges-stt = { path = "../vyges-tools-stt" }

[patch."https://github.com/vyges-tools/dpl.git"]
vyges-dpl = { path = "../vyges-tools-dpl" }

[patch."https://github.com/vyges-tools/loom.git"]
vyges-loom = { path = "../vyges-tools-loom" }
